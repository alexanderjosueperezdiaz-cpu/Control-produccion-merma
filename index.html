<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Producción</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    .kpi-group { display: flex; gap: 20px; margin-bottom: 20px; }
    .kpi { background: #0f4c81; color: white; padding: 15px; border-radius: 6px; flex: 1; text-align: center; }
    .kpi h3 { margin: 0; font-size: 0.9rem; }
    .kpi p { margin: 5px 0 0; font-size: 1.5rem; font-weight: bold; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px; background: #0f4c81; color: white; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>

<div class="container">
  <h1>Control de Producción y Merma</h1>
  
  <div class="kpi-group">
    <div class="kpi"><h3>Total Producido</h3><p id="kpi-producido">0</p></div>
    <div class="kpi"><h3>Total Merma</h3><p id="kpi-merma">0</p></div>
    <div class="kpi"><h3>% Merma</h3><p id="kpi-porcentaje">0.0%</p></div>
  </div>

  <form id="form-lote">
    <input type="text" id="lote" placeholder="Código o nombre del lote" required>
    <input type="number" id="producido" placeholder="Unidades producidas" min="1" required>
    <input type="number" id="merma" placeholder="Unidades con merma" min="0" required>
    <button type="submit">Guardar registro</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Lote</th>
        <th>Producido</th>
        <th>Merma</th>
        <th>% Merma</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tabla-cuerpo">
      <tr><td colspan="5">No hay registros guardados.</td></tr>
    </tbody>
  </table>
  <button id="btn-limpiar" style="margin-top: 15px; background: #dc2626;">Borrar todo</button>
</div>

<script>
  const STORAGE_KEY = 'control_produccion_final_v1';
  let registros = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  const form = document.getElementById('form-lote');
  const loteInput = document.getElementById('lote');
  const producidoInput = document.getElementById('producido');
  const mermaInput = document.getElementById('merma');
  const tablaCuerpo = document.getElementById('tabla-cuerpo');
  const btnLimpiar = document.getElementById('btn-limpiar');
  const kpiProducido = document.getElementById('kpi-producido');
  const kpiMerma = document.getElementById('kpi-merma');
  const kpiPorcentaje = document.getElementById('kpi-porcentaje');

  function actualizar() {
    let tProd = 0;
    let tMerma = 0;

    registros.forEach(r => {
      tProd += Number(r.producido) || 0;
      tMerma += Number(r.merma) || 0;
    });

    const pctGlobal = tProd > 0 ? ((tMerma / tProd) * 100).toFixed(1) : '0.0';

    kpiProducido.textContent = tProd.toLocaleString();
    kpiMerma.textContent = tMerma.toLocaleString();
    kpiPorcentaje.textContent = pctGlobal + '%';

    tablaCuerpo.innerHTML = '';
    if (registros.length === 0) {
      tablaCuerpo.innerHTML = '<tr><td colspan="5">No hay registros guardados.</td></tr>';
      return;
    }

    registros.forEach((item, index) => {
      const pctItem = item.producido > 0 ? ((item.merma / item.producido) * 100).toFixed(2) : '0.0';
      const fila = document.createElement('tr');
      fila.innerHTML = `
        <td>${item.lote}</td>
        <td>${Number(item.producido).toLocaleString()}</td>
        <td>${Number(item.merma).toLocaleString()}</td>
        <td>${pctItem}%</td>
        <td><button onclick="borrar(${index})" style="background:#dc2626; padding:5px 10px;">Eliminar</button></td>
      `;
      tablaCuerpo.appendChild(fila);
    });
  }

  window.borrar = function(index) {
    registros.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
    actualizar();
  };

  form.onsubmit = function(e) {
    e.preventDefault();
    const lote = loteInput.value.trim();
    const producido = Number(producidoInput.value);
    const merma = Number(mermaInput.value);

    if (!lote || producido <= 0 || merma < 0 || merma > producido) {
      alert("Datos inválidos: verifica que lo producido sea mayor a 0 y la merma no supere la producción.");
      return;
    }

    registros.unshift({ lote, producido, merma });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
    actualizar();
    form.reset();
  };

  btnLimpiar.onclick = function() {
    if (confirm('¿Borrar todos los registros?')) {
      registros = [];
      localStorage.removeItem(STORAGE_KEY);
      actualizar();
    }
  };

  actualizar();
</script>

</body>
</html>
